<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waste Sorting Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  --page:#f1ecdf; --ink:#1b2433; --muted:#665f50; --card:#faf7ee; --line:#dcd2ba; --red:#d9402b; --stage:#132038;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0c121d;--ink:#ebe6d8;--muted:#9a9484;--card:#141d2d;--line:#25324a}}
:root[data-theme="dark"]{--page:#0c121d;--ink:#ebe6d8;--muted:#9a9484;--card:#141d2d;--line:#25324a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:var(--page);color:var(--ink);font-family:var(--font);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:10px;margin:0}
.seal{flex:none;width:38px;height:38px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;transform:rotate(-4deg);box-shadow:0 0 0 2px var(--page),0 0 0 3px var(--red) inset}
h1{font-size:clamp(20px,4.5vw,28px);font-weight:900;letter-spacing:-.01em;margin:0;line-height:1.05}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:3px}

.hud{display:grid;grid-template-columns:1.2fr 1fr .9fr 1.5fr;gap:8px;flex:1;min-width:300px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat small{display:block;color:var(--muted);font-size:14px;font-weight:500}
.stat b{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.stat:first-child b{font-size:34px}
.lives{display:flex;gap:2px;font-size:19px;line-height:1.3;color:var(--red)}
.lives span.off{opacity:.22}
.stage{position:relative;flex:1;min-height:0;width:100%;border-radius:18px;overflow:hidden;background:var(--stage);box-shadow:0 18px 40px -18px rgba(10,20,40,.6),0 0 0 3px var(--card),0 0 0 4px var(--line);touch-action:none}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:11px;padding:20px;text-align:center;color:#ebe6d8;background:rgba(14,24,42,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-size:36px;font-weight:900;line-height:1.1}
.overlay p{margin:0;font-size:17px;line-height:1.5;color:#b4bccb;max-width:32ch}
.legend{display:flex;flex-direction:column;gap:5px;width:100%;max-width:300px;text-align:left}
.legend div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-left:5px solid var(--c);border-radius:8px;padding:6px 12px;font-size:16px}
.legend b{font-size:18px;font-weight:900}
.legend span{margin-left:auto;color:#b4bccb}
.big{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
button{font:inherit;font-weight:700;font-size:19px;color:#fff;background:var(--red);border:0;border-radius:10px;padding:12px 30px;cursor:pointer;transition:transform .15s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #f0c23a;outline-offset:3px}




.hint{color:var(--muted);font-size:14px;margin:0;text-align:center}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tool{background:transparent;color:var(--muted);border:2px solid var(--line);padding:6px 16px;font-size:16px;border-radius:10px}
@media (max-width:380px){.hud{grid-template-columns:1fr 1fr}.stat:first-child{grid-column:span 2}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
  <div class="title">
    <div class="seal" aria-hidden="true">♻</div>
    <h1>Waste Sorting Game<small>Japanese-style home sorting</small></h1>
  </div>

  <section class="hud" aria-label="Game status">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
    <div class="stat"><small>Level</small><b id="level">1</b></div>
    <div class="stat"><small id="livesLabel">Lives</small><div class="lives" id="lives" aria-live="polite"></div></div>
  </section>
  </header>

  <div class="stage">
    <canvas id="gameCanvas" aria-label="Waste sorting playfield"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="bar">
    <button class="tool" id="mute" aria-pressed="false">Sound on</button>
    <button class="tool" id="fs" hidden>⛶ Fullscreen</button>
    <p class="hint">Follow the glowing bin. Arrow keys or drag to steer. Hold click or ↓ to drop faster.</p>
  </div>
</main>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = 420, H = 630, GAP = 6, BW = 56, S = 1;
const BIN_H = 100, stage = document.querySelector('.stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif';

const bins = [
  { type: 'burn',  k: '🔥', name: 'Burnable',      label: ['Burnable'],        color: '#d9402b', tc: '#fff' },
  { type: 'non',   k: '🧱', name: 'Non-burnable',  label: ['Non-', 'burnable'], color: '#3a6cc0', tc: '#fff' },
  { type: 'plas',  k: '🛍️', name: 'Plastic wrap',  label: ['Plastic', 'wrap'],  color: '#f0c23a', tc: '#241c05' },
  { type: 'pet',   k: '🧴', name: 'PET bottles',   label: ['PET', 'bottles'],   color: '#2e9b6c', tc: '#fff' },
  { type: 'can',   k: '🥫', name: 'Cans & glass',  label: ['Cans &', 'glass'],  color: '#7e5cc4', tc: '#fff' },
  { type: 'paper', k: '📄', name: 'Paper',         label: ['Paper'],            color: '#a8764a', tc: '#fff' }
];
bins.forEach((b, i) => b.x = GAP + i * (BW + GAP));

const items = [
  { e: '🍌', type: 'burn', name: 'Banana peel' },   { e: '🥢', type: 'burn', name: 'Chopsticks' },
  { e: '🧻', type: 'burn', name: 'Tissues' },       { e: '🍱', type: 'burn', name: 'Leftover bento' },
  { e: '🍵', type: 'non', name: 'Ceramic teacup' }, { e: '🍳', type: 'non', name: 'Frying pan' },
  { e: '☂️', type: 'non', name: 'Broken umbrella' }, { e: '🥛', type: 'non', name: 'Drinking glass' },
  { e: '🍜', type: 'plas', name: 'Noodle cup' },    { e: '🛍️', type: 'plas', name: 'Shopping bag' },
  { e: '🥡', type: 'plas', name: 'Takeout tray' },  { e: '🍬', type: 'plas', name: 'Candy wrapper' },
  { e: '🧴', type: 'pet', name: 'Tea bottle' },     { e: '🥤', type: 'pet', name: 'Soda bottle' },
  { e: '🍼', type: 'pet', name: 'Water bottle' },
  { e: '🥫', type: 'can', name: 'Food can' },       { e: '🍾', type: 'can', name: 'Glass bottle' },
  { e: '🫙', type: 'can', name: 'Glass jar' },      { e: '🍶', type: 'can', name: 'Sake bottle' },
  { e: '📰', type: 'paper', name: 'Newspaper' },    { e: '📦', type: 'paper', name: 'Cardboard' },
  { e: '📚', type: 'paper', name: 'Magazines' },    { e: '✉️', type: 'paper', name: 'Envelope' }
];

// sound: synthesized with Web Audio, no audio files needed
let actx = null, musicGain = null, muted = false;
try { muted = localStorage.getItem('wsg-mute') === '1'; } catch (e) {}
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); musicGain = actx.createGain(); musicGain.gain.value = .6; musicGain.connect(actx.destination); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, at, dur, type, vol, f2) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
const sfx = {
  good(n) {
    const f = SCALE[Math.min(Math.max(n - 1, 0), 7)];
    tone(f, 0, .35, 'triangle', .22); tone(f * 2, 0, .22, 'sine', .12); tone(f * 3, .03, .15, 'sine', .05);
  },
  meh() { tone(392, 0, .18, 'triangle', .18); tone(330, .09, .22, 'triangle', .15); },
  bad() { tone(280, 0, .22, 'sawtooth', .1, 180); tone(200, .16, .32, 'sawtooth', .1, 110); },
  heart() { [783.99, 987.77, 1174.66].forEach((f, i) => tone(f, .1 + i * .07, .28, 'sine', .16)); },
  pop() { tone(500, 0, .12, 'sine', .2, 1400); },
  level() {
    [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => {
      tone(f, .15 + i * .08, .3, 'triangle', .2); tone(f * 2, .15 + i * .08, .18, 'sine', .08);
    });
  },
  over() { [523.25, 440, 349.23, 261.63].forEach((f, i) => tone(f, i * .18, .4, 'triangle', .22)); }
};

// background music: a calm looping pentatonic tune, generated live
const SC = [293.66, 329.63, 392, 440, 493.88, 587.33, 659.25, 783.99, 880];
const MEL = [5,-1,3,-1,2,-1,3,-1, 5,-1,6,-1,5,-1,3,-1,  2,-1,3,-1,2,-1,1,-1, 0,-1,1,-1,2,-1,-1,-1,
             3,-1,5,-1,6,-1,5,-1, 3,-1,2,-1,3,-1,5,-1,  6,-1,5,-1,3,-1,2,-1, 1,-1,2,-1,0,-1,-1,-1];
const BASS = [[146.83, 110], [98, 146.83], [110, 164.81], [146.83, 110]];
let musicOn = false, mStep = 0, mNext = 0, mTimer = null;
function note(f, t, dur, type, vol, att) {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (att || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.05);
}
function stepDur() { return 60 / (92 + Math.min(level - 1, 8) * 4) / 2; }
function playStep(i, t) {
  const bar = Math.floor(i / 16) % 4, k = i % 16;
  if (k === 0 || k === 8) note(BASS[bar][k / 8], t, 1.3, 'sine', .11, .02);
  if (k === 0) note(BASS[bar][0] * 2, t, stepDur() * 15, 'sine', .035, .6);
  const m = MEL[i];
  if (m >= 0) { note(SC[m], t, .7, 'triangle', .075); note(SC[m] * 2, t, .25, 'sine', .025); }
}
function musicTick() {
  if (!actx) return;
  if (mNext < actx.currentTime - .1) mNext = actx.currentTime + .05;
  while (mNext < actx.currentTime + .3) { playStep(mStep, mNext); mNext += stepDur(); mStep = (mStep + 1) % MEL.length; }
}
function startMusic() {
  if (musicOn || !ac()) return;
  musicOn = true; mStep = 0; mNext = actx.currentTime + .15; musicTick(); mTimer = setInterval(musicTick, 80);
}
function stopMusic() { musicOn = false; clearInterval(mTimer); }
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else if (musicOn) actx.resume();
});

// seigaiha wave pattern, drawn once
const bg = document.createElement('canvas');
function makeBg() {
  bg.width = W; bg.height = H;
  const c = bg.getContext('2d'), g = c.createLinearGradient(0, 0, 0, H), r = 24;
  g.addColorStop(0, '#111c31'); g.addColorStop(1, '#1d3354');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(255,255,255,.055)'; c.lineWidth = 1.2;
  for (let row = 0; row * r / 2 < H + r; row++)
    for (let x = (row % 2 ? r : 0) - r; x < W + r; x += r * 2)
      for (let k = r; k > 5; k -= 6) { c.beginPath(); c.arc(x, row * r / 2, k, Math.PI, 0); c.stroke(); }
}

let state = 'ready', score = 0, lives = 6, goodCount = 0, streak = 0, level = 1, best = 0;
let item = null, parts = [], floats = [], toast = null, shake = 0, last = 0;
const keys = {};
let fast = false;
try { best = +localStorage.getItem('wsg-best') || 0; } catch (e) {}

const $ = id => document.getElementById(id);
function hud() {
  $('livesLabel').textContent = lives < 6 ? 'Lives, +1 in ' + (3 - goodCount) : 'Lives';
  $('score').textContent = score; $('best').textContent = best; $('level').textContent = level;
  $('lives').innerHTML = [0, 1, 2, 3, 4, 5].map(i => `<span class="${i < lives ? '' : 'off'}">♥</span>`).join('');
}
function layout() {
  const r = stage.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const oW = W, oH = H, d = Math.min(devicePixelRatio || 1, 2);
  S = Math.max(1, Math.min(r.width / 520, r.height / 560));
  W = r.width / S; H = r.height / S;
  GAP = W > 500 ? 10 : 6; BW = (W - GAP * 7) / 6;
  bins.forEach((b, i) => b.x = GAP + i * (BW + GAP));
  canvas.width = r.width * d; canvas.height = r.height * d;
  ctx.setTransform(d * S, 0, 0, d * S, 0, 0);
  if (item) { item.x *= W / oW; item.y *= H / oH; }
  makeBg();
}
new ResizeObserver(layout).observe(stage); layout();

function showOverlay(over) {
  const o = $('overlay'); o.hidden = false;
  o.innerHTML = over
    ? `<h2>Round over</h2><div class="big">${score}</div>
       <p>${score >= best && score > 0 ? 'New best score.' : 'Best score: ' + best + '.'} You reached level ${level}.</p>
       <button id="go">Play again</button>`
    : `<h2>Sort it out</h2>
       <p>Each item shows where it belongs, and the right bin glows. Steer it there. Every 3 correct sorts win back a heart.</p>
       <div class="legend">${bins.map(b => `<div style="--c:${b.color}"><b>${b.name}</b><span>${b.k}</span></div>`).join('')}</div>
       <p>PET bottles come with a cap (marked red) and a label. Click the bottle to peel them off first for bonus points.</p>
       <button id="go">Start game</button>`;
  $('go').onclick = start; $('go').focus({ preventScroll: true });
}
function start() {
  score = 0; lives = 6; goodCount = 0; streak = 0; level = 1; parts = []; floats = []; toast = null; item = null;
  state = 'play'; $('overlay').hidden = true; ac(); startMusic(); hud();
}
function spawn() {
  const t = items[Math.floor(Math.random() * items.length)];
  item = { ...t, x: W / 2, y: -40, r: 34, prep: t.type === 'pet' };
  hud();
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 1, color });
  }
}
function peel() {
  if (state !== 'play' || !item || !item.prep) return;
  item.prep = false; sfx.pop(); hud();
  burst(item.x + 20, item.y - 20, '#f0c23a', reduceMotion ? 0 : 10);
  floats.push({ t: 'Peeled', x: item.x, y: item.y - 50, life: 1, color: '#f0c23a' });
}

function binAt(x) { return bins.find(b => x >= b.x - GAP / 2 && x <= b.x + BW + GAP / 2); }
function land() {
  const bin = binAt(item.x), ok = bin && bin.type === item.type;
  const right = bins.find(b => b.type === item.type);
  if (ok) {
    let pts = 10 + Math.min(streak, 5) * 2;
    if (item.type === 'pet') {
      if (item.prep) { pts = 4; streak = 0; toast = { t: 'Peel cap and label first', c: '#f0c23a', life: 1.8 }; }
      else { pts += 5; streak++; toast = { t: 'Clean PET bottle', c: bin.color, life: 1 }; }
    } else { streak++; toast = { t: streak > 2 ? streak + ' in a row' : item.name + ' sorted', c: bin.color, life: 1 }; }
    score += pts;
    if (item.type === 'pet' && item.prep) sfx.meh(); else sfx.good(streak);
    if (++goodCount >= 3) {
      goodCount = 0;
      if (lives < 6) { lives++; sfx.heart(); floats.push({ t: '+1 ♥', x: Math.min(Math.max(item.x, 40), W - 40), y: H - BIN_H - 44, life: 1.3, color: '#ff6b5a' }); }
    }
    burst(item.x, H - BIN_H, bin.color, reduceMotion ? 0 : 22);
    floats.push({ t: '+' + pts, x: item.x, y: H - BIN_H - 10, life: 1, color: bin.color });
    const nl = 1 + Math.floor(score / 100);
    if (nl !== level) { level = nl; sfx.level(); toast = { t: 'Level ' + level + ', faster!', c: '#fff', life: 1.6 }; }
  } else {
    streak = 0; lives--; sfx.bad(); shake = reduceMotion ? 0 : 0.35;
    burst(item.x, H - BIN_H, '#d9402b', reduceMotion ? 0 : 12);
    toast = { t: item.name + ' goes in ' + right.name, c: '#ff9a8c', life: 2 };
  }
  item = null;
  if (score > best) { best = score; try { localStorage.setItem('wsg-best', best); } catch (e) {} }
  if (lives <= 0) { state = 'over'; stopMusic(); setTimeout(() => sfx.over(), 500); setTimeout(() => showOverlay(true), 450); }
  hud();
}
function update(dt) {
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt * 1.6; });
  parts = parts.filter(p => p.life > 0);
  floats.forEach(f => { f.y -= 40 * dt; f.life -= dt * 1.3; });
  floats = floats.filter(f => f.life > 0);
  if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  if (shake > 0) shake -= dt;
  if (state !== 'play') return;
  if (!item) spawn();
  const move = W * .8 * dt;
  if (keys.ArrowLeft) item.x -= move;
  if (keys.ArrowRight) item.x += move;
  item.x = Math.max(item.r, Math.min(W - item.r, item.x));
  item.y += Math.min(100 * Math.pow(1.18, level - 1), 450) * ((keys.ArrowDown || fast) ? 3.4 : 1) * dt;
  if (item.y + item.r >= H - BIN_H + 8) land();
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, 0); ctx.arcTo(x, y + h, x, y, 0); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function draw() {
  ctx.save(); ctx.clearRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  ctx.fillStyle = '#111c31'; ctx.fillRect(-10, -10, W + 20, H + 20);
  ctx.drawImage(bg, 0, 0, W, H);
  const active = item && binAt(item.x), target = item && bins.find(b => b.type === item.type), pulse = .5 + .5 * Math.sin(performance.now() / 220);

  bins.forEach(b => {
    ctx.fillStyle = target === b ? hexA(b.color, .18 + pulse * .14) : active === b ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.025)';
    ctx.fillRect(b.x, 0, BW, H - BIN_H);
  });
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.setLineDash([4, 8]); ctx.lineWidth = 1;
  [1, 2, 3, 4, 5].forEach(i => { const x = bins[i].x - GAP / 2; ctx.beginPath(); ctx.moveTo(x, 70); ctx.lineTo(x, H - BIN_H); ctx.stroke(); });
  ctx.setLineDash([]);

  bins.forEach(b => {
    const on = active === b, y = H - BIN_H + (on ? -4 : 0), cx = b.x + BW / 2;
    ctx.save();
    if (on || target === b) { ctx.shadowColor = b.color; ctx.shadowBlur = target === b ? 14 + pulse * 22 : 14; }
    ctx.fillStyle = hexA(b.color, target ? (target === b ? 1 : .5) : .88); rr(b.x, y, BW, BIN_H + 4, 12); ctx.fill();
    ctx.restore();
    if (target === b) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; rr(b.x, y, BW, BIN_H + 4, 12); ctx.stroke();
      const ay = y - 20 + pulse * 6; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(cx - 10, ay); ctx.lineTo(cx + 10, ay); ctx.lineTo(cx, ay + 12); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(b.x, y + 12, BW, 3);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = b.tc;
    ctx.font = '28px sans-serif'; ctx.fillText(b.k, cx, y + 38); ctx.fillStyle = b.tc;
    ctx.font = `900 13px ${FONT}`;
    b.label.forEach((ln, i) => ctx.fillText(ln, cx, y + 65 + i * 15));
  });

  if (item) {
    const c = target.color;
    ctx.strokeStyle = hexA(c, .55); ctx.lineWidth = 2; ctx.setLineDash([3, 7]);
    ctx.beginPath(); ctx.moveTo(item.x, item.y + item.r + 4); ctx.lineTo(item.x, H - BIN_H - 6); ctx.stroke();
    ctx.setLineDash([]);
    ctx.save(); ctx.shadowColor = c; ctx.shadowBlur = 26; ctx.fillStyle = '#f7f3e8';
    ctx.beginPath(); ctx.arc(item.x, item.y, item.r, 0, 7); ctx.fill(); ctx.restore();
    ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(item.x, item.y, item.r, 0, 7); ctx.stroke();
    ctx.font = '42px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000'; ctx.fillText(item.e, item.x, item.y + 3);
    if (item.prep) {
      ctx.fillStyle = '#d9402b'; ctx.beginPath(); ctx.arc(item.x + 28, item.y - 28, 16, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `900 12px ${FONT}`; ctx.fillText('cap', item.x + 28, item.y - 28);
      ctx.fillStyle = '#f0c23a'; ctx.font = `900 15px ${FONT}`; ctx.fillText('Click to peel', item.x, item.y + item.r + 20);
    }
    const label = item.name + '  →  ' + target.name;
    ctx.font = `900 16px ${FONT}`;
    const tw = ctx.measureText(label).width + 24, tx = Math.max(4, Math.min(W - tw - 4, item.x - tw / 2));
    ctx.fillStyle = target.color; rr(tx, item.y - item.r - 34, tw, 28, 14); ctx.fill();
    ctx.fillStyle = target.tc; ctx.fillText(label, tx + tw / 2, item.y - item.r - 19.5);
  }

  parts.forEach(p => { ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 5, 5); });
  ctx.globalAlpha = 1;
  floats.forEach(f => {
    ctx.globalAlpha = Math.max(f.life, 0); ctx.fillStyle = f.color; ctx.font = `900 28px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(f.t, f.x, f.y);
  });
  ctx.globalAlpha = 1;
  if (toast) {
    ctx.globalAlpha = Math.min(toast.life * 2, 1); ctx.font = `900 19px ${FONT}`;
    const w = ctx.measureText(toast.t).width + 36;
    ctx.fillStyle = 'rgba(8,16,30,.75)'; rr(W / 2 - w / 2, 18, w, 42, 21); ctx.fill();
    ctx.fillStyle = toast.c; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toast.t, W / 2, 40);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function loop(t) {
  const dt = Math.min((t - last) / 1000 || 0, 0.05); last = t;
  update(dt); draw(); requestAnimationFrame(loop);
}
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowDown'].includes(e.key)) { keys[e.key] = true; if (state === 'play') e.preventDefault(); }
});
addEventListener('keyup', e => { keys[e.key] = false; });
function px(e) { const r = canvas.getBoundingClientRect(); return Math.max(34, Math.min(W - 34, (e.clientX - r.left) / r.width * W)); }
canvas.addEventListener('pointermove', e => { if (state === 'play' && item && (e.pointerType === 'mouse' || e.buttons)) item.x = px(e); });
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play' || !item) return;
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (item.prep && Math.hypot(x - item.x, y - item.y) <= item.r + 16) { peel(); return; }
  item.x = px(e); fast = true;
});
['pointerup', 'pointercancel', 'blur'].forEach(ev => addEventListener(ev, () => { fast = false; }));

function muteUI() { $('mute').textContent = muted ? '🔇 Sound off' : '🔊 Sound on'; $('mute').setAttribute('aria-pressed', muted); }
$('mute').onclick = () => {
  muted = !muted; try { localStorage.setItem('wsg-mute', muted ? '1' : '0'); } catch (e) {}
  muteUI(); if (!muted) { ac(); sfx.pop(); } $('mute').blur();
};
const fsBtn = $('fs');
if (document.fullscreenEnabled && document.documentElement.requestFullscreen) fsBtn.hidden = false;
fsBtn.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
  fsBtn.blur();
};
document.addEventListener('fullscreenchange', () => { fsBtn.textContent = document.fullscreenElement ? 'Exit fullscreen' : '⛶ Fullscreen'; });
muteUI(); hud(); showOverlay(false); requestAnimationFrame(loop);
</script>
